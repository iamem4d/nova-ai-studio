
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d16">
<title>AI Support Assistant | Nova AI Studio</title>
<meta name="description" content="Explore Nova AI Studio's interactive customer support assistant demo and discover smart digital support experiences.">
<link rel="canonical" href="https://iamem4d.github.io/nova-ai-studio/support-demo.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  background:radial-gradient(circle at 50% 0%,#102a3b,#080d16 55%);
  color:#eaf5ff;
  font-family:Inter,Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.app{
  width:100%;
  max-width:850px;
  height:min(780px,90vh);
  min-height:560px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid #1d4052;
  border-radius:20px;
  background:rgba(10,20,32,.92);
  box-shadow:0 20px 80px #0008,0 0 45px #00d9ff12;
}

.header{
  padding:20px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border-bottom:1px solid #1b3445;
  background:#0c1825;
}

.brand{display:flex;align-items:center;gap:12px}

.logo{
  width:42px;height:42px;border-radius:12px;
  display:grid;place-items:center;
  background:#00d9ef18;border:1px solid #00d9ef66;
  color:#00e5ff;font-size:23px;font-weight:bold;
}

.brand h1{font-size:16px;letter-spacing:1px}
.brand p{font-size:11px;color:#849bac;margin-top:5px}

.header-right{
  display:flex;
  align-items:center;
  gap:15px;
}

.language-select{
  padding:8px 10px;
  border-radius:9px;
  border:1px solid #24556b;
  background:#102333;
  color:#9defff;
  font-size:12px;
  outline:none;
  cursor:pointer;
}

.status{font-size:12px;color:#64e8ad;white-space:nowrap}

.status i{
  display:inline-block;width:7px;height:7px;
  background:#45e8a0;border-radius:50%;margin-right:6px;
}

.chat{
  flex:1;overflow-y:auto;padding:25px;
  display:flex;flex-direction:column;gap:18px;
}

.message{
  max-width:82%;padding:14px 17px;
  border-radius:15px;font-size:14px;line-height:1.8;
  white-space:pre-wrap;overflow-wrap:anywhere;
}

.bot{
  align-self:flex-start;
  background:#142638;border:1px solid #25465a;
  border-bottom-left-radius:4px;
}

.user{
  align-self:flex-end;
  background:#063d50;border:1px solid #08718a;
  border-bottom-right-radius:4px;
}

.time{
  display:block;font-size:10px;
  color:#8299a9;margin-top:6px;
}

.suggestions{
  display:flex;flex-wrap:wrap;gap:9px;
  padding:0 25px 17px;
}

.suggestion{
  padding:9px 13px;border-radius:20px;
  border:1px solid #24556b;background:#102333;
  color:#9defff;font-size:12px;cursor:pointer;
  transition:.2s;
}

.suggestion:hover{background:#16465a;border-color:#00d9ef}

.input-area{
  padding:18px 22px;
  border-top:1px solid #1b3445;
  background:#0c1825;
}

.input-row{display:flex;gap:10px}

input{
  min-width:0;flex:1;padding:15px;
  border-radius:11px;border:1px solid #25465a;
  background:#101f2e;color:white;outline:none;
  font-size:14px;
}

input:focus{border-color:#00d9ef}

button{border:0;cursor:pointer;font-weight:bold}

.send{
  width:52px;border-radius:11px;
  background:#00d9ef;color:#07131c;font-size:20px;
}

.send:hover{background:#70f0ff}

.footer{
  text-align:center;color:#61798b;
  font-size:10px;margin-top:13px;
}

.footer a{color:#00d9ef;text-decoration:none}

/* RTL SUPPORT */
html[dir="rtl"] body,
html[dir="rtl"] .app{
  direction:rtl;
}

html[dir="rtl"] .brand,
html[dir="rtl"] .header,
html[dir="rtl"] .header-right{
  direction:rtl;
}

html[dir="rtl"] .status i{
  margin-right:0;
  margin-left:6px;
}

html[dir="rtl"] .bot{
  align-self:flex-start;
  border-bottom-left-radius:15px;
  border-bottom-right-radius:4px;
}

html[dir="rtl"] .user{
  align-self:flex-end;
  border-bottom-right-radius:15px;
  border-bottom-left-radius:4px;
}

html[dir="rtl"] .input-row{
  direction:rtl;
}

html[dir="rtl"] .message,
html[dir="rtl"] input{
  text-align:right;
}

html[lang="fa"] body,
html[lang="fa"] button,
html[lang="fa"] input,
html[lang="fa"] select{
  font-family:"Vazirmatn",Arial,sans-serif;
}

html[lang="fa"] .message{
  line-height:2;
}

html[lang="fa"] .brand h1{
  letter-spacing:0;
}

@media(max-width:500px){
  body{padding:0}
  .app{height:100vh;min-height:0;border-radius:0;border:0}
  .header{padding:16px}
  .header-right{gap:9px}
  .chat{padding:18px}
  .message{max-width:90%}
  .suggestions{padding:0 18px 15px}
  .brand h1{font-size:13px}
  .brand p{font-size:10px}
  .language-select{padding:7px 6px;font-size:11px}
  .status{font-size:11px}
}
</style>
</head>

<div class="app">

  <header class="header">
    <div class="brand">
      <div class="logo">N.</div>
      <div>
        <h1>NOVA AI SUPPORT</h1>
        <p id="subtitle">Customer Support Assistant</p>
      </div>
    </div>

    <div class="header-right">
      <select class="language-select" id="languageSelect" aria-label="Select language">
        <option value="en">EN</option>
        <option value="fa">فارسی</option>
        <option value="ar">العربية</option>
        <option value="fr">FR</option>
        <option value="de">DE</option>
        <option value="zh">中文</option>
      </select>

      <div class="status"><i></i><span id="onlineText">Online</span></div>
    </div>
  </header>

  <main class="chat" id="chat">
    <div class="message bot" id="welcomeMessage">
      Hello! Welcome to Nova AI Support.

      I'm your virtual support assistant. How can I help you today?
      <span class="time">Nova Assistant</span>
    </div>
  </main>

  <div class="suggestions">
    <button class="suggestion" data-question="services" id="suggestionServices">Our Services</button>
    <button class="suggestion" data-question="website" id="suggestionWebsite">Request a Website</button>
    <button class="suggestion" data-question="contact" id="suggestionContact">Contact Support</button>
    <button class="suggestion" data-question="hours" id="suggestionHours">Working Hours</button>
  </div>

  <form class="input-area" id="chatForm">
    <div class="input-row">
      <input id="userInput" type="text" placeholder="Type your message..." autocomplete="off" required>
      <button class="send" id="sendButton" type="submit" aria-label="Send message">➤</button>
    </div>
    <div class="footer" id="footerText">
      Demo experience by <a href="index.html">Nova AI Studio</a>
    </div>
  </form>

</div>

let currentLanguage = "en";

function getSavedLanguage(){
  try{
    const saved = localStorage.getItem("nova-language");
    return translations[saved] ? saved : "en";
  }catch(error){
    return "en";
  }
}

function setLanguage(language){
  if(!translations[language]) language = "en";

  currentLanguage = language;

  const t = translations[language];
  const rtl = language === "fa" || language === "ar";

  document.documentElement.lang = language;
  document.documentElement.dir = rtl ? "rtl" : "ltr";

  languageSelect.value = language;

  document.getElementById("subtitle").textContent = t.subtitle;
  document.getElementById("onlineText").textContent = t.online;
  document.getElementById("welcomeMessage").innerHTML =
    escapeHTML(t.welcome) +
    '<span class="time">' + escapeHTML(t.assistant) + '</span>';

  document.getElementById("suggestionServices").textContent = t.suggestions[0];
  document.getElementById("suggestionWebsite").textContent = t.suggestions[1];
  document.getElementById("suggestionContact").textContent = t.suggestions[2];
  document.getElementById("suggestionHours").textContent = t.suggestions[3];

  input.placeholder = t.placeholder;
  document.getElementById("sendButton").setAttribute("aria-label",t.send);
  document.getElementById("footerText").innerHTML = t.footer;

  chat.scrollTop = 0;

  try{
    localStorage.setItem("nova-language",language);
  }catch(error){
    // Local storage may be unavailable.
  }
}

function escapeHTML(text){
  return text.replace(/[&<>"']/g,function(character){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[character];
  });
}

function addMessage(text,type){
  const message = document.createElement("div");
  message.className = "message " + type;
  message.appendChild(document.createTextNode(text));

  const time = document.createElement("span");
  time.className = "time";

  const t = translations[currentLanguage];
  time.textContent = type === "bot" ? t.assistant : t.you;

  message.appendChild(time);
  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
}

function getAnswer(text){
  const normalized = text.toLowerCase();
  const t = translations[currentLanguage];

  for(const item of t.answers){
    if(item.keys.some(key=>normalized.includes(key.toLowerCase()))){
      return item.reply;
    }
  }

  return t.fallback;
}

function sendMessage(text){
  const value = text.trim();
  if(!value) return;

  addMessage(value,"user");
  input.value = "";

  setTimeout(()=>{
    addMessage(getAnswer(value),"bot");
  },450);
}

form.addEventListener("submit",event=>{
  event.preventDefault();
  sendMessage(input.value);
});

document.querySelectorAll(".suggestion").forEach(button=>{
  button.addEventListener("click",()=>{
    const key = button.dataset.question;
    sendMessage(translations[currentLanguage].prompts[key]);
  });
});

languageSelect.addEventListener("change",()=>{
  setLanguage(languageSelect.value);
});

setLanguage(getSavedLanguage());
</script>
